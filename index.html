<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050d2b">
  <title>ACAVEN DE R.L. · La magia de ganar</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            acavenNavy: "#050c2b",
            acavenDeep: "#091449",
            acavenBlue: "#147cff",
            acavenCyan: "#3be0ff",
            acavenGold: "#ffd24c",
            acavenGoldLight: "#fff3b0",
            acavenCrimson: "#d91e36"
          },
          keyframes: {
            pointerTension: {
              "0%, 74%": { transform: "translateY(0) rotate(0deg)" },
              "78%": { transform: "translateY(3px) rotate(-9deg)" },
              "81%": { transform: "translateY(0) rotate(7deg)" },
              "84%": { transform: "translateY(2px) rotate(-6deg)" },
              "87%": { transform: "translateY(0) rotate(4deg)" },
              "91%": { transform: "translateY(1px) rotate(-2deg)" },
              "95%, 100%": { transform: "translateY(0) rotate(0deg)" }
            },
            glowTension: {
              "0%, 72%": { opacity: "0.38", transform: "scale(1)" },
              "82%": { opacity: "0.75", transform: "scale(1.1)" },
              "90%": { opacity: "0.48", transform: "scale(1.03)" },
              "100%": { opacity: "0.68", transform: "scale(1.06)" }
            },
            logoPulse: {
              "0%, 100%": {
                transform: "scale(1)",
                filter: "drop-shadow(0 0 22px rgba(59,224,255,0.65)) drop-shadow(0 10px 26px rgba(255,210,76,0.42))"
              },
              "50%": {
                transform: "scale(1.04)",
                filter: "drop-shadow(0 0 34px rgba(255,210,76,0.8)) drop-shadow(0 12px 32px rgba(59,224,255,0.85))"
              }
            },
            fall: {
              to: {
                transform: "translate3d(var(--x), 110vh, 0) rotate(900deg)"
              }
            }
          },
          animation: {
            pointerTension: "pointerTension 10s cubic-bezier(.2,.7,.15,1) both",
            glowTension: "glowTension 10s ease-in-out both",
            logoPulse: "logoPulse 3.2s ease-in-out infinite",
            fall: "fall linear forwards"
          }
        }
      }
    };
  </script>

  <link rel="stylesheet" href="styles.css">
</head>
<body class="min-h-screen overflow-x-hidden text-slate-50 antialiased selection:bg-acavenGold selection:text-acavenNavy">
  <!-- Decoración navideña de fondo: auroras, marca de agua, nieve cayendo y guirnalda -->
  <div class="aurora aurora-one" aria-hidden="true"></div>
  <div class="aurora aurora-two" aria-hidden="true"></div>
  <div class="aurora aurora-three" aria-hidden="true"></div>
  <img id="brand-watermark" class="brand-watermark" alt="" aria-hidden="true">
  <div class="snow-layer snow-back" aria-hidden="true"></div>
  <div class="snow-layer snow-front" aria-hidden="true"></div>
  <div class="holiday-garland" aria-hidden="true">
    <span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span>
  </div>

  <!-- VISTA PÚBLICA -->
  <main id="public-view" class="app-shell relative z-10 mx-auto flex min-h-screen max-w-6xl flex-col items-center px-4 pt-6 pb-4 sm:px-6 sm:pt-8">
    <header class="hero-header relative w-full text-center">
      <div class="season-chip inline-flex items-center justify-center gap-3 rounded-full border border-acavenGold/55 bg-acavenDeep/80 px-5 py-1.5 text-[11px] font-extrabold uppercase tracking-[0.22em] text-acavenGoldLight shadow-[0_0_24px_rgba(255,210,76,0.25),inset_0_0_16px_rgba(59,224,255,0.14)] backdrop-blur-md">
        <span class="chip-star text-base text-acavenGold">✦</span>
        <span data-config="brand.eyebrow"></span>
        <span class="chip-star text-base text-acavenGold">✦</span>
      </div>

      <!-- Logo protagonista grande con halo comercial festivo -->
      <div class="logo-spotlight relative mx-auto mt-2 mb-1 flex items-center justify-center">
        <img
          id="brand-logo"
          class="brand-logo animate-logoPulse relative z-10 block object-contain"
          alt="Logo ACAVEN DE R.L."
        >
      </div>

      <h1
        data-config="brand.title"
        class="tv-title mx-auto max-w-4xl font-black uppercase leading-[0.95] tracking-[0.03em] text-[clamp(2.35rem,6vw,4.5rem)]"
      ></h1>

      <p
        data-config="brand.subtitle"
        class="mx-auto mt-3 max-w-2xl text-sm font-semibold tracking-[0.07em] text-sky-100 drop-shadow-[0_2px_10px_rgba(0,0,0,0.85)] sm:text-lg"
      ></p>
    </header>

    <!-- ESCENARIO PRINCIPAL DE LA RULETA -->
    <section class="stage relative mx-auto flex items-center justify-center" aria-label="Ruleta de premios">
      <div class="stage-glow"></div>

      <!-- Indicador superior dorado -->
      <div class="pointer" aria-hidden="true"><span></span></div>

      <!-- Aro luminoso + ruleta -->
      <div class="wheel-frame">
        <div id="wheel" class="wheel" role="img" aria-label="Ruleta de premios"></div>
        <div class="wheel-rim rim-inner"></div>
        <div class="wheel-bulbs" aria-hidden="true"></div>

        <button
          id="spin-button"
          class="spin-button group transition-transform duration-200 active:translate-x-[-50%] active:translate-y-[-48%] active:scale-95"
          type="button"
          aria-label="Girar ruleta"
        >
          <span class="spin-button-star">✦</span>
          <span id="spin-label">GIRAR</span>
          <small>ESPACIO</small>
        </button>
      </div>

      <!-- Pedestal luminoso inferior -->
      <div class="pedestal" aria-hidden="true">
        <span></span><span></span><span></span>
      </div>
    </section>

    <!-- CONTADOR DE PREMIOS -->
    <section
      class="status-card mt-2 flex items-center justify-center gap-4 rounded-full border border-acavenGold/60 bg-acavenDeep/85 px-6 py-2.5 text-xs font-bold uppercase tracking-[0.14em] text-white backdrop-blur-md sm:gap-5 sm:px-8 sm:py-3 sm:text-sm"
      aria-live="polite"
    >
      <span class="status-icon text-lg text-acavenGold">✦</span>
      <strong id="remaining-count" class="text-2xl font-black tracking-normal text-acavenGold sm:text-3xl">0</strong>
      <span id="remaining-label" class="text-sky-100">premios disponibles</span>
      <span class="status-icon text-lg text-acavenGold">✦</span>
    </section>

    <!-- PIE DE PÁGINA -->
    <footer class="public-footer mt-auto flex flex-col items-center gap-2 pt-6 text-center text-[11px] tracking-[0.05em] text-sky-200/80 sm:flex-row sm:gap-4">
      <span data-config="brand.footer"></span>
      <a
        href="#mantenimiento"
        data-config="labels.maintenance"
        class="border-b border-acavenCyan/80 pb-0.5 font-semibold text-acavenCyan transition hover:border-acavenGold hover:text-acavenGold"
      ></a>
    </footer>
  </main>

  <!-- VISTA DE MANTENIMIENTO -->
  <main id="maintenance-view" class="maintenance-shell relative z-10 mx-auto max-w-6xl px-4 pt-8 pb-16 sm:px-6" hidden>
    <header class="maintenance-header mb-7 flex flex-col items-start justify-between gap-4 border-b border-sky-400/20 pb-5 sm:flex-row sm:items-end">
      <div>
        <span class="admin-kicker block text-[11px] font-extrabold uppercase tracking-[0.16em] text-acavenCyan">
          PANEL INTERNO · <span data-config="brand.name"></span>
        </span>
        <h1 class="mt-1 text-2xl font-black tracking-tight text-white sm:text-4xl">Configuración de la experiencia</h1>
      </div>
      <a
        class="ghost-button inline-flex items-center rounded-lg border border-acavenCyan/70 bg-acavenDeep/60 px-4 py-2.5 text-sm font-bold text-acavenCyan no-underline transition hover:border-acavenGold hover:bg-acavenGold/15 hover:text-acavenGoldLight"
        href="index.html"
        data-config="labels.backToDraw"
      ></a>
    </header>

    <section class="maintenance-tools panel mb-6 flex flex-col items-start justify-between gap-5 rounded-2xl border border-sky-400/25 bg-acavenDeep/85 p-5 shadow-2xl backdrop-blur-md sm:flex-row sm:items-center sm:p-6">
      <div>
        <strong class="text-sm uppercase tracking-wider text-acavenGoldLight">Versión activa:</strong>
        <span id="config-version" class="ml-1 rounded bg-sky-950/90 px-2 py-0.5 font-mono text-xs text-acavenCyan border border-sky-500/30"></span>
        <p class="muted mt-1.5 text-xs text-sky-200/75 sm:text-sm">Los cambios se guardan automáticamente en este equipo.</p>
      </div>
      <div class="tool-actions flex flex-wrap gap-2.5">
        <button id="copy-config" class="secondary-button rounded-xl bg-sky-100 px-4 py-2.5 text-xs font-extrabold uppercase tracking-wider text-acavenNavy transition hover:-translate-y-0.5 hover:bg-white sm:text-sm" type="button" data-config="labels.copy"></button>
        <button id="download-config" class="secondary-button rounded-xl bg-sky-100 px-4 py-2.5 text-xs font-extrabold uppercase tracking-wider text-acavenNavy transition hover:-translate-y-0.5 hover:bg-white sm:text-sm" type="button" data-config="labels.download"></button>
        <button id="reset-config" class="danger-button rounded-xl bg-rose-400 px-4 py-2.5 text-xs font-extrabold uppercase tracking-wider text-slate-950 transition hover:-translate-y-0.5 hover:bg-rose-300 sm:text-sm" type="button" data-config="labels.reset"></button>
      </div>
    </section>

    <section class="panel prize-editor rounded-2xl border border-sky-400/25 bg-acavenDeep/85 p-5 shadow-2xl backdrop-blur-md sm:p-6">
      <div class="panel-title mb-5 flex flex-col items-start justify-between gap-4 sm:flex-row sm:items-center">
        <div>
          <span class="admin-kicker block text-[11px] font-extrabold uppercase tracking-[0.16em] text-acavenCyan">INVENTARIO</span>
          <h2 class="mt-0.5 text-xl font-black text-white sm:text-2xl">Premios de la ruleta</h2>
        </div>
        <button
          id="add-prize"
          class="primary-button rounded-xl bg-gradient-to-br from-acavenGoldLight via-acavenGold to-amber-500 px-5 py-2.5 text-sm font-black uppercase tracking-wider text-acavenNavy shadow-[0_0_20px_rgba(255,210,76,0.35)] transition hover:-translate-y-0.5 hover:brightness-105"
          type="button"
          data-config="labels.addPrize"
        ></button>
      </div>
      <div id="prize-list"></div>
    </section>

    <p id="maintenance-message" class="maintenance-message fixed bottom-5 left-1/2 z-50 -translate-x-1/2 rounded-full border border-acavenGold/60 bg-acavenGoldLight px-5 py-2.5 text-xs font-extrabold uppercase tracking-wider text-acavenNavy opacity-0 shadow-2xl transition-opacity duration-200" role="status"></p>
  </main>

  <!-- MODAL DE GANADOR -->
  <div id="winner-modal" class="modal-backdrop fixed inset-0 z-40 grid place-items-center bg-slate-950/85 p-5 backdrop-blur-md" hidden>
    <div class="winner-modal relative w-full max-w-md rounded-3xl border-2 border-acavenGold bg-gradient-to-b from-sky-800/95 via-acavenDeep to-acavenNavy px-6 pt-9 pb-7 text-center shadow-[0_0_60px_rgba(20,124,255,0.55),0_0_30px_rgba(255,210,76,0.28),0_20px_60px_rgba(0,0,0,0.9)] sm:px-8" role="dialog" aria-modal="true" aria-labelledby="winner-title">
      <button
        id="close-modal"
        class="modal-close absolute top-3 right-4 cursor-pointer border-0 bg-transparent text-3xl leading-none text-sky-200 transition hover:scale-110 hover:text-acavenGold"
        type="button"
        aria-label="Cerrar"
      >×</button>
      <div class="modal-sparkle text-4xl text-acavenGold drop-shadow-[0_0_16px_rgba(255,210,76,0.75)]">✦</div>
      <h2 id="winner-title" class="mt-1 mb-2 text-3xl font-black uppercase tracking-wide text-acavenGoldLight drop-shadow-[0_3px_12px_rgba(0,0,0,0.65)] sm:text-4xl"></h2>
      <p id="winner-lead" class="m-0 text-sm font-semibold uppercase tracking-widest text-sky-200"></p>
      <img
        id="winner-image"
        alt="Premio ganado"
        class="mx-auto mt-4 mb-2 block h-36 w-40 rounded-2xl border border-acavenGold/35 bg-slate-950/55 p-2 object-contain shadow-[0_8px_24px_rgba(0,0,0,0.65)]"
      >
      <h3 id="winner-prize" class="mt-1 mb-6 text-2xl font-black tracking-tight text-white drop-shadow-[0_2px_10px_rgba(0,0,0,0.75)]"></h3>
      <button
        id="modal-continue"
        class="primary-button w-full cursor-pointer rounded-xl bg-gradient-to-br from-acavenGoldLight via-acavenGold to-amber-500 px-6 py-3 text-sm font-black uppercase tracking-widest text-acavenNavy shadow-[0_0_24px_rgba(255,210,76,0.4)] transition hover:scale-[1.02] hover:brightness-105"
        type="button"
      ></button>
    </div>
  </div>

  <!-- CONFETI -->
  <div id="confetti" class="pointer-events-none fixed inset-0 z-50 overflow-hidden" aria-hidden="true"></div>

  <script src="lib/jquery-3.7.1.min.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
